<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı — Rota</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #1a1330 0%, #0a0814 60%);
        color: #f7f6fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 380px;
        width: 100%;
        padding: 32px 28px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #9b72ff, #6c2fff);
        font-size: 26px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 13.5px;
        line-height: 1.6;
        color: rgba(247, 246, 250, 0.6);
        margin: 0 0 22px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 16px;
        padding: 11px 22px;
        font-size: 13.5px;
        font-weight: 500;
        color: #fff;
        background: linear-gradient(180deg, #9b72ff, #6c2fff);
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Şu an çevrimdışısın</h1>
      <p>
        İnternet bağlantısı yok. Daha önce görüntülediğin sayfalar önbellekte
        mevcutsa açılmaya devam eder; yeni veriler için bağlantı geldiğinde
        tekrar dene.
      </p>
      <button onclick="location.reload()">Tekrar Dene</button>
    </div>
  </body>
</html>
